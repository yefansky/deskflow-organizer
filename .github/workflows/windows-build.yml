name: Windows build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.20.0
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Set build version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -ne (Get-Content VERSION -Raw).Trim()) { throw 'Tag does not match VERSION.' }
          } else {
            $base = (Get-Content VERSION -Raw).Trim().Split('.')
            $version = "$($base[0]).$($base[1]).$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          Set-Content VERSION $version -Encoding utf8
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Compile and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build EXE installer and legacy upgrade ZIP
        run: ./packaging/build.ps1
      - name: Verify frozen GUI and MCP
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/verify_bundle.py dist/DESKFLOW
      - name: Verify installation, upgrade and uninstall
        run: python packaging/verify_install.py
      - name: Upload installer and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-windows
          path: |
            dist/installer/*
            build/verification/*
          if-no-files-found: error
      - name: Publish complete GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite published assets." }
          gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "DESKFLOW $env:RELEASE_TAG" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release.' }
          gh release upload $env:RELEASE_TAG dist/installer/DESKFLOW-windows-x64-Setup.exe dist/installer/DESKFLOW-windows-x64-Setup.exe.sha256 dist/installer/DESKFLOW-windows-x64.zip dist/installer/DESKFLOW-windows-x64.zip.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release files.' }
          $api = gh release view $env:RELEASE_TAG --json apiUrl --jq '.apiUrl'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate draft release.' }
          gh api --method PATCH $api -F draft=false -f make_latest=legacy | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release.' }
